[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "mercaribot"
version = "2.0.0"
description = "A clean, asynchronous, and modular Mercari Japan scraping bot with Telegram notifications."
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
authors = [
    { name = "MercariBOT Team" }
]
dependencies = [
    "httpx>=0.25.0",
    "cryptography>=41.0.0",
    "python-dotenv>=1.0.0",
    "tomli>=2.0.1; python_version < '3.11'",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0.0",
    "pytest-asyncio>=0.23.0",
]

[project.scripts]
mercaribot = "mercaribot.cli:run"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
