name: DevSecOps CI & Security Audit

on:
  push:
    branches: [ "main", "master" ]
  pull_request:
    branches: [ "main", "master" ]

permissions:
  contents: read

jobs:
  security-audit:
    name: Security & Quality Audit
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: "pip"

      - name: Install Dependencies & Security Scanners
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev]"
          pip install ruff bandit pip-audit

      - name: Run Ruff (Code Quality & Security Linter)
        run: |
          ruff check src/

      - name: Run Bandit (SAST - Static Application Security Testing)
        run: |
          bandit -r src/

      - name: Run Pip-Audit (SCA - Software Composition Analysis)
        run: |
          pip-audit

      - name: Run Automated Unit Tests (pytest)
        run: |
          pytest -v
